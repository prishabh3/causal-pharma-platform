services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: causal_user
      POSTGRES_PASSWORD: causal_password
      POSTGRES_DB: causal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causal_user -d causal_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    command: >
      sh -c "pip install psycopg2-binary --quiet &&
             mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri postgresql://causal_user:causal_password@db:5432/causal_db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    # Use python (always available in mlflow image) instead of curl for healthcheck
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://causal_user:causal_password@db:5432/causal_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    # Only wait for DB — mlflow slowness should not block the API from starting
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./backend:/app/backend
      - ./causal:/app/causal
      - ./data:/app/data
      - ./explainability:/app/explainability
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    # Only wait for backend to be healthy
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./frontend:/app/frontend

volumes:
  postgres_data:
